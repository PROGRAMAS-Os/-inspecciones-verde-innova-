<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel interno · Inspecciones Verde Innova</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="encabezado">
  <div class="fila">
    <a class="volver" href="index.html">←</a>
    <h1>Panel interno</h1>
    <span id="puntoEnVivo" class="estado-conexion oculto">● en vivo</span>
  </div>
</header>

<main class="contenedor">

  <div id="tarjetaLogin" class="tarjeta">
    <h2>Iniciar sesión</h2>
    <p class="ayuda">Solo para el equipo interno de Verde Innova. Tu cuenta la crea Osvaldo desde Supabase.</p>
    <div class="campo"><label for="loginEmail">Correo</label><input type="email" id="loginEmail" autocomplete="username"></div>
    <div class="campo"><label for="loginPassword">Contraseña</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <div class="acciones">
      <button class="boton boton-primario" id="btnIniciarSesion">Iniciar sesión</button>
    </div>
    <p id="loginError" class="pista" style="color:var(--rojo);"></p>
  </div>

  <div id="panel" class="oculto">
    <div class="tarjeta">
      <div class="fila" style="justify-content:space-between;">
        <span id="sesionComo" class="pista"></span>
        <button class="boton boton-chico boton-fantasma" id="btnCerrarSesion">Cerrar sesión</button>
      </div>
    </div>

    <div class="tarjeta">
      <h2>Informes generales</h2>
      <div id="listaInformes"><p class="mensaje-vacio">Cargando…</p></div>
    </div>

    <div class="tarjeta">
      <h2>Checklists por SKU</h2>
      <div id="listaChecklists"><p class="mensaje-vacio">Cargando…</p></div>
    </div>
  </div>

  <footer class="pie">Verde Innova — Inspecciones de calidad</footer>
</main>

<script src="js/vendor/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
